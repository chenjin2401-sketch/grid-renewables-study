[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridstudy"
version = "0.1.0"
description = "Open interconnection study for solar + storage on transmission test systems"
requires-python = ">=3.10"
dependencies = [
    "pandapower",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "pyomo",
    "highspy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
